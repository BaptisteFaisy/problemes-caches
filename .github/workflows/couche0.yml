name: couche0

# Couche 0 : les règles dures du dépôt, vérifiées avant toute revue.
#   - moins de 500 lignes par fichier de code, moins de 50 lignes par fonction
#   - manifest.yml valide contre le schéma Forge officiel
#   - tests du gate hermes (résolution de conflits)
# Budget CI 5 min (règle user 2026-10-24).
#
# Runners hébergés par GitHub, même motif et même raison que `ci.yml`
# (dépôt public = minutes gratuites ; workers self-hosted du r630 devenus sourds
# le 2026-11-11, canal broker cassé).

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - 'manifest.yml'
      - '.github/**'

concurrency:
  group: couche0-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  couche0:
    name: couche0
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Tailles (fichiers < 500, fonctions < 50)
        run: python3 tools/check_limits.py

      - name: Tests du gate hermes (conflits)
        run: python3 .github/hermes/test_gate.py

      - name: Tests du balayeur de la file Mergify
        run: python3 .github/mergify/test_sweep.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dépendances du validateur de manifeste
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: manifest.yml contre le schéma Forge
        run: node tools/validate_manifest.mjs manifest.yml
