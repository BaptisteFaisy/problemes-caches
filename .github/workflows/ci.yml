name: ci

# Budget CI 5 min (règle user 2026-10-24) : typage strict + tests du domaine.
# Le build Forge (`forge build`) et le déploiement restent hors PR.
#
# Runners : **hébergés par GitHub** (`ubuntu-latest`). Le dépôt est public, donc
# ces minutes sont gratuites. Choix du 2026-11-11, mesuré : les 5 workers
# self-hosted du r630 étaient « online » mais n'acquerraient plus aucun job —
# `_diag/Runner_*.log` montrait le canal broker cassé en boucle
# (`BrokerServer … SocketException (125): Operation canceled`, `Back off …
# 4 attempt left`). Cause probable : ~105 listeners runner long-pollent GitHub
# depuis la même adresse IP sur cette machine. Le gate hermes reste self-hosted
# (il a besoin du daemon ZeroClaw local) mais n'est pas un check requis.
#
# Conséquence acceptée : `@forge/react` tire Atlaskit (404 paquets), donc
# `npm ci` repart du cache npm de GitHub à chaque run (~1 à 2 min), ce qui tient
# dans le budget de 5 minutes.

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - 'manifest.yml'
      - '.github/workflows/**'

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dépendances
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Typage strict
        run: npm run typecheck

      - name: Tests du domaine
        run: npm test
