# File de merge Mergify — Problèmes cachés dans les tickets (socle CI self-hosted, R630).
#
# Trois checks sont exigés avant l'entrée dans la file :
#   - ci-budget : aucun job déclaré à plus de 5 minutes (règle user 2026-10-24) ;
#   - ci        : typage strict + tests du domaine (Node 22) ;
#   - couche0   : fichiers < 500 lignes, fonctions < 50 lignes, manifest valide.
# Le gate hermes-lite reste en dry-run (HERMES_LITE_DRY_RUN=1) : Mergify est
# le seul pilote de merge ; sur conflit, hermes saisit un agent qui résout et
# pousse sur la branche de la PR.

queue_rules:
  - name: default
    queue_conditions:
      - check-success = ci-budget
      - check-success = ci
      - check-success = couche0
      - -conflict
      - -draft
      - base = main
    batch_size:
      min: 1
      max: 3
    batch_max_wait_time: "10 seconds"
    max_checks_retries: 1
    checks_timeout: 5 min
    merge_method: squash
    update_method: merge
    commit_message_format:
      title: pr-title
      body: pr-body

priority_rules:
  - name: urgent
    conditions:
      - label = urgent
    priority: high
  - name: priority-low
    conditions:
      - label = priority-low
    priority: low

merge_queue:
  max_parallel_checks: 4

pull_request_rules:
  - name: file automatique des PR prêtes
    conditions:
      - check-success = ci-budget
      - check-success = ci
      - check-success = couche0
      - check-success = stale-base-guard
      - -closed
      - -draft
      - -conflict
      - -label = hold
      - base = main
    actions:
      queue:

merge_protections_settings:
  auto_merge_conditions: true
